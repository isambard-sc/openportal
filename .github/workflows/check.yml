name: Check

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel, main]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  licenses:
    name: License REUSE spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install reuse
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install reuse
      - name: Check REUSE spec
        run: ~/venv/bin/reuse lint
  changelog:
    name: Changelog format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install kacl
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install python-kacl
      - name: Check changelog format
        run: ~/venv/bin/kacl-cli verify
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check dependencies against the RustSec advisory database
        # Nothing was watching the ~200-crate dependency tree for published
        # advisories; a vulnerable transitive dependency could sit in a release
        # indefinitely. See docs/specifications/security-review-2.md section 5.
        run: cargo audit --deny warnings

  code-checks:
    name: Tests and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # This is needed so that git-describe works properly to set the version
      - name: install MUSL
        run: sudo apt install musl-tools
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt
      - name: Install Hurl
        run: |
          VERSION=4.3.0
          curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/${VERSION}/hurl_${VERSION}_amd64.deb
          sudo dpkg -i hurl_${VERSION}_amd64.deb
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Linting
        # --all-targets so test code is linted too, and -D warnings so a lint
        # actually fails the job - a bare `cargo clippy` only printed warnings,
        # so the workspace lints (unwrap_used, indexing_slicing, ...) were
        # advisory in CI and drifted.
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Secret-write guard
        run: ./scripts/check-secret-writes.sh
      - name: Build
        run: cargo build
      - name: Test
        # --all-targets so the agent binary crates' tests run, not just the
        # library crates'.
        run: cargo test --all-targets
      - name: Integration tests (need to add)
        run: |
          oci/portal/build.sh
          oci/bridge/build.sh
        env:
          TERM: xterm-256color
