[package]
name = "op-cloudaccount"
version = "0.91.0"
description = "Agent that represents a cloud account (e.g. an AWS account) assigned to a project [temporary]"
edition = "2021"
license = "MIT"
homepage = "https://github.com/chryswoods/openportal/"
repository = "https://github.com/chryswoods/openportal/"

[dependencies]
anyhow = { version="1.0.100", features = ["backtrace"] }
chrono = { version="0.4.42", features=["serde"] }
dirs = "6.0.0"
greatwestern = { path = "../greatwestern" }
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
templemeads = { path = "../templemeads" }
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1.41"

[lints]
workspace = true

[package.metadata.clippy]
allow-dbg-in-tests = true
