[package]
name = "op-cloudportal"
version = "0.90.0"
description = "Self-contained portal agent representing the 'cloud' portal, fronting one or more op-cloudaccount agents"
edition = "2021"
license = "MIT"
homepage = "https://github.com/chryswoods/openportal/"
repository = "https://github.com/chryswoods/openportal/"

[dependencies]
anyhow = { version="1.0.100", features = ["backtrace"] }
clap = { version = "4.5.51", features = ["derive"] }
dirs = "6.0.0"
greatwestern = { path = "../greatwestern" }
once_cell = "1.21.3"
paddington = { path = "../paddington" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
templemeads = { path = "../templemeads" }
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1.41"

[lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"

[package.metadata.clippy]
allow-dbg-in-tests = true
