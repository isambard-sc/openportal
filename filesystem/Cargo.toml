[package]
name = "op-filesystem"
version = "0.95.0"
description = "Agent that interfaces OpenPortal with a filesystem"
edition = "2021"
license = "MIT"
repository = "https://github.com/isambard-sc/openportal/"

[dependencies]
anyhow = { version="1.0.100", features = ["backtrace"] }
bradshaw = { path = "../bradshaw" }
dirs = "6.0.0"
greatwestern = { path = "../greatwestern" }
nix = { version = "0.31.0", features = ["fs", "user"] }
once_cell = "1.21.3"
rand = { version = "0.9.2", features = ["std_rng"] }
regex = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
templemeads = { path = "../templemeads" }
tokio = { version = "1.48", features = ["full"] }
toml = "0.9.8"
tracing = "0.1.41"

unix_mode = "0.1.4"

[lints]
workspace = true

[package.metadata.clippy]
allow-dbg-in-tests = true
