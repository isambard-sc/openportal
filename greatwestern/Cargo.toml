[package]
name = "greatwestern"
version = "0.92.0"
description = "The HPC/Waldur command vocabulary (Instruction, identifiers, usage and storage reports) that rides on top of paddington and templemeads - the reference Domain, and the one every built-in OpenPortal agent is compiled against"
edition = "2021"
license = "MIT"
homepage = "https://github.com/chryswoods/openportal/"
repository = "https://github.com/chryswoods/openportal/"

[dependencies]
anyhow = { version="1.0.100", features = ["backtrace"] }
chrono = { version="0.4.42", features=["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
templemeads = { path = "../templemeads" }
tracing = "0.1.41"
ts-rs = { version = "10", features = ["uuid-impl", "chrono-impl"] }
url = { version="2.5.7", features=["serde"] }
uuid = { version="1.18.1", features=["serde", "v4", "fast-rng", "macro-diagnostics"] }
wildmatch = "2.4"

[lints]
workspace = true

[package.metadata.clippy]
allow-dbg-in-tests = true
