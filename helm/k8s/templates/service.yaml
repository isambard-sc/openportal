---
apiVersion: v1
kind: Service
metadata:
  name: op-k8s
spec:
  ports:
    - protocol: TCP
      port: {{ .Values.port }}
      name: agent
      targetPort: {{ .Values.port }}
    - protocol: TCP
      port: {{ .Values.health_port }}
      name: health
      targetPort: {{ .Values.health_port }}
  selector:
    app.kubernetes.io/name: op-k8s
