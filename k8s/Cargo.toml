[package]
name = "op-k8s"
version = "0.93.0"
description = "Agent that interfaces OpenPortal with a Kubernetes cluster"
edition = "2021"
license = "MIT"
homepage = "https://github.com/chryswoods/openportal/"
repository = "https://github.com/chryswoods/openportal/"

[[bin]]
name = "op-k8s"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
base64 = "0.23.1"
chrono = "0.4.42"
dirs = "6.0.0"
greatwestern = { path = "../greatwestern" }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
kube = { version = "4.2.0", features = ["derive"] }
once_cell = "1.21.3"
rustls = { version = "0.23.35", features = ["ring"] }
schemars = "1.0.4"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
templemeads = { path = "../templemeads" }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1.41"

[lints]
workspace = true
