[package]
name = "op-localaccount"
version = "0.1.0"
description = "Account agent using local Unix user/group management (for testing)"
edition = "2021"
license = "MIT"
repository = "https://github.com/isambard-sc/openportal/"

[dependencies]
anyhow = { version="1.0.100", features = ["backtrace"] }
bradshaw = { path = "../bradshaw" }
dirs = "6.0.0"
greatwestern = { path = "../greatwestern" }
once_cell = "1.21.3"
templemeads = { path = "../templemeads" }
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1.41"

[lints]
workspace = true

[package.metadata.clippy]
allow-dbg-in-tests = true
