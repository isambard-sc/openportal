[package]
name = "openportal"
version = "0.94.2"
description = "Python wrappers for OpenPortal"
edition = "2021"
license = "MIT"
repository = "https://github.com/isambard-sc/openportal/"

[lib]
name = "openportal"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["generate-stubs"]

[dependencies]
anyhow = { version="1.0.100", features = ["backtrace"] }
bradshaw = { path = "../bradshaw", features = ["pyo3", "stub-gen"] }
greatwestern = { path = "../greatwestern" }
once_cell = "1.21.3"
paddington = { path = "../paddington" }
pyo3 = { version="0.27.1", features = ["abi3-py310"] }
pyo3-stub-gen = "0.22.1"
reqwest = { version = "0.12.24", default-features = false, features = ["cookies", "json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
templemeads = { path = "../templemeads" }
toml = "0.9.8"
tracing = "0.1.41"

url = {version="2.5.7", features=["serde"]}
uuid = { version="1.18.1", features=["serde", "v4", "fast-rng", "macro-diagnostics"] }

[build-dependencies]
pyo3-build-config = "0.27.1"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
generate-stubs = []

[lints]
workspace = true
